<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>LAST LINE 漢字防衛戦（こども用）</title>
<style>
:root{--c:#35e6ff;--c2:#7ff3ff;--r:#ff3b4e;--y:#ffd166;--bg:#04070d;--tx:#e6f1fb;--mu:#8ea4bb;--pn:rgba(7,13,23,.86);--ln:rgba(53,230,255,.38)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden;font-family:'BIZ UDGothic','Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#screen{position:fixed;inset:0;display:none;overflow:auto;padding:18px}
#screen.on{display:block}
#screen button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
button{min-height:44px}

/* 見出し */
.hdr{display:flex;align-items:center;gap:14px;max-width:1120px;margin:0 auto 14px;flex-wrap:wrap}
.hdr h2{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em;text-shadow:0 2px 8px #000}
.back{background:var(--pn);border:1px solid var(--ln);padding:8px 16px;clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px)}
.prog{color:var(--c2);font-weight:800;margin-left:auto}
.gradeTabs{display:inline-flex;border:1px solid var(--ln);background:var(--pn)}
.gradeTabs button{padding:8px clamp(8px,1.6vw,20px);font-weight:900;color:var(--mu)}
.gradeTabs button.on{background:var(--c);color:#02151b}
.gradeTabs.small button{padding:6px clamp(6px,1.1vw,14px)}
ruby{ruby-align:center}
rt{font-size:max(.52em,9px);font-weight:700;letter-spacing:0;text-shadow:none}

/* タイトル */
#screen.s-title{overflow:hidden auto;padding:0;background:linear-gradient(90deg,rgba(2,5,12,.88) 0,rgba(2,5,12,.66) 40%,rgba(2,5,12,0) 68%)}
.ttl{position:relative;min-height:100%;display:flex;align-items:center;padding:3vh 4vw}
.ttlHero{position:absolute;right:3vw;bottom:0;height:96%;pointer-events:none;display:flex;align-items:flex-end}
.hero{height:100%;width:auto;filter:drop-shadow(0 0 40px rgba(53,230,255,.2))}
.ttlMain{position:relative;width:min(600px,92vw);z-index:2}
.logo{width:100%;display:block;filter:drop-shadow(0 6px 20px rgba(0,0,0,.8))}
.sub{display:flex;align-items:baseline;gap:4px 14px;margin:2px 0 8px 6px;flex-wrap:wrap}
.sub span{font-size:clamp(24px,7vw,30px);font-weight:900;letter-spacing:.24em;white-space:nowrap;color:#fff;text-shadow:0 0 16px rgba(255,59,78,.9)}
.sub em{font-style:normal;color:var(--c2);font-size:13px;font-weight:700}
.story{margin:0 0 14px 6px;font-size:14px;line-height:1.75;color:#c9d8e8;text-shadow:0 1px 4px #000}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.menu button{background:var(--pn);border:1px solid var(--ln);padding:12px 16px;text-align:left;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);transition:transform .1s,background .1s}
.menu button:hover{background:rgba(20,50,70,.95);transform:translateX(3px)}
.menu b{display:block;font-size:17px;font-weight:900}
.menu small{color:var(--mu);font-size:12px}
.menu .main{grid-column:1/3;background:linear-gradient(90deg,var(--r),#a50d26);border-color:#ff8a96;padding:16px 22px}
.menu .main:hover{background:linear-gradient(90deg,#ff5a6a,#c8102e)}
.menu .main b{font-size:28px;letter-spacing:.2em}
.menu .main small{color:#ffd9dd}
.foot{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.rank{font-weight:900;color:var(--y);font-size:15px}
.rank small{color:#c9d8e8;font-weight:700;font-size:12px}
.count{color:var(--mu);font-size:13px;flex:1}
.lite{padding:6px 12px;border:1px solid var(--ln);background:var(--pn);font-size:13px}

/* 地図 */
#screen.s-map{background:linear-gradient(rgba(3,6,13,.52),rgba(3,6,13,.8))}
#screen.s-brief,#screen.s-sheet,#screen.s-result{background:linear-gradient(rgba(3,6,13,.72),rgba(3,6,13,.9))}
.map{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.node{position:relative;overflow:hidden;min-height:128px;background:linear-gradient(120deg,rgba(7,13,23,.97) 45%,var(--th2));border:1px solid var(--th);padding:12px 14px 16px;text-align:left;display:flex;flex-direction:column;gap:3px;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);transition:transform .1s,background .1s}
.node:hover{transform:translateY(-3px);background:rgba(16,44,64,.96)}
.node.done{border-color:var(--y)}
.nbg{position:absolute;right:-20px;top:-8px;width:138px;height:138px;opacity:.8;pointer-events:none}.nbg svg{width:100%;height:100%;display:block}.node>span:not(.nbg){position:relative}
.no{font:italic 900 34px ui-monospace,'Roboto Mono',Consolas,monospace;color:var(--th)}
.nm{font-weight:900;font-size:18px;text-shadow:0 1px 4px #000}
.sample{color:#c9d8e8;font-size:14px;text-shadow:0 1px 3px #000;letter-spacing:.12em}
.st i{font-style:normal;color:#2c3a4b;font-size:17px}.st i.on,.bigStars i.on{color:var(--y)}
.bar{height:4px;background:rgba(255,255,255,.1);display:block;margin-top:4px}.bar i{display:block;height:100%;background:var(--c)}
.med{position:absolute;top:12px;right:12px;font:800 11px ui-monospace,monospace;padding:2px 6px;border:1px solid currentColor}
.m-rookie{color:#9ad}.m-guard{color:var(--c)}.m-ace{color:var(--y)}.m-limit{color:var(--r)}
.mapBottom{max-width:1120px;margin:12px auto 0;display:grid;grid-template-columns:2fr 1fr;gap:11px}
.final,.retrain{background:var(--pn);border:1px solid var(--r);padding:14px 18px;text-align:left}
.final{background:linear-gradient(90deg,rgba(120,10,30,.9),rgba(30,6,14,.9))}
.retrain{border-color:var(--y)}
.final b,.retrain b{display:block;font-size:18px;font-weight:900}
.final small,.retrain small{color:#d9c5ca;font-size:12px}
.final .st i,.final small i{font-style:normal;color:#553;}.final small i.on{color:var(--y)}
.lock{opacity:.55}

/* 作戦説明 */
.brief{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.bL,.bR{background:var(--pn);border:1px solid var(--ln);padding:16px}
.goal{margin:0 0 12px;line-height:1.6}.goal b{color:var(--y);margin-right:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{width:50px;height:50px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;border:1px solid #3b4d63;background:#0b1320;color:#9db2c8;padding:0;min-height:0}
.chip.m1{border-color:var(--r);color:#ffc0c6;background:#2a0d14}
.chip.m2{border-color:var(--c);color:#fff;background:#0a2a36}
.chip.m3{border-color:var(--y);color:var(--y);background:#332a0a}
.chip.sel{outline:3px solid #fff}
.chips.big .chip{width:44px;height:44px;font-size:24px}
.rules{margin:14px 0 0;padding-left:18px;color:#c9d8e8;font-size:15px;line-height:1.75}
.bossCard{display:flex;align-items:center;gap:14px;margin-bottom:12px;background:#060a12;border:1px solid rgba(255,59,78,.5);padding:6px 12px}
.bossCard b{display:block;font-size:18px}.bossCard small{font:700 12px ui-monospace,monospace;color:var(--mu)}
.bthumb{width:104px;height:104px;flex:none}
.pickRow{margin-bottom:10px}.pickRow label{display:block;font-size:12px;color:var(--c2);font-weight:800;margin-bottom:5px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.seg.two{grid-template-columns:1fr 1fr}.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:1px solid #2c3a4b;background:#0b1320;padding:8px 4px;text-align:center}
.seg button.on{border-color:var(--c);background:#0d3644}
.seg b{display:block;font:800 14px ui-monospace,'Roboto Mono',monospace}.seg.three b{font-family:inherit}.seg small{color:var(--mu);font-size:11px}
.go{display:block;width:100%;padding:15px;margin-top:6px;font-size:22px;font-weight:900;letter-spacing:.14em;background:linear-gradient(90deg,var(--r),#a50d26);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.go:hover{background:linear-gradient(90deg,#ff5a6a,#c8102e)}

/* 説明・設定 */
.sheet{max-width:880px;margin:0 auto;background:var(--pn);border:1px solid var(--ln);padding:18px 22px;line-height:1.75}
.sheet h3{color:var(--c2);margin:16px 0 4px;font-size:17px}.sheet h3:first-child{margin-top:0}.sheet p{margin:0 0 6px}
.credit{color:var(--mu);font-size:12px;margin-top:12px!important}
.romaTable div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;margin-bottom:2px}
.romaTable span{background:#0b1320;padding:3px 6px;font-size:13px;white-space:nowrap;overflow:hidden}
.set{display:grid;grid-template-columns:1fr auto;width:100%;background:#0b1320;border:1px solid #2c3a4b;padding:10px 14px;margin-bottom:6px;text-align:left;gap:0 12px}
.set b{font-weight:900}.set small{color:var(--mu);grid-row:2}.set em{grid-row:1/3;grid-column:2;align-self:center;font:900 15px ui-monospace,monospace;font-style:normal;color:var(--mu)}
.set.on{border-color:var(--c)}.set.on em{color:var(--c)}
.danger{border:1px solid var(--r);color:#ffc0c6;padding:8px 16px;background:#2a0d14}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.stats span{background:#0b1320;padding:8px;text-align:center;font-size:11px;color:var(--mu)}.stats b{display:block;font:900 23px ui-monospace,monospace;color:#fff}
.note{color:var(--mu);font-size:13px}
.detail{display:flex;gap:14px;background:#0b1320;border:1px solid var(--c);padding:10px;margin-bottom:12px}
.detail .bk{font-size:58px;line-height:1.1}.detail p{margin:0 0 2px;font-size:14px}.detail em{font-style:normal;color:var(--y);font-weight:800}

/* 一時停止 */
#screen.s-pause{background:#02050a}
.pause{width:min(640px,100%);margin:auto}.pause h2{font:italic 900 52px ui-monospace,monospace;margin:0;color:var(--c)}.pause p{color:var(--mu);margin:0 0 10px}
.pbtn{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:10px}.pbtn>button:last-child{border:1px solid var(--ln);background:var(--pn)}

/* 結果 */
.result{max-width:880px;margin:0 auto}
.rTop{text-align:center;background:var(--pn);border:1px solid var(--ln);padding:16px}
.result h1{margin:0;font:italic 900 clamp(34px,6vw,60px) ui-monospace,'Roboto Mono',monospace;color:var(--c);letter-spacing:.01em}
.result.l h1{color:var(--r)}
.bigStars i{font-style:normal;font-size:52px;color:#2c3a4b}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.nums span{background:#0b1320;padding:7px;font-size:12px;color:var(--mu)}.nums b{display:block;font:900 24px ui-monospace,monospace;color:#fff}
.best{color:var(--y);font-weight:900;margin:8px 0 0}
.code{margin:8px 0 0}.code b{font:900 26px ui-monospace,monospace;color:var(--y);letter-spacing:.1em;margin:0 8px}.code small{color:var(--mu)}
.sugg{margin-top:10px;background:#0b1320;border:1px solid var(--y);padding:8px 12px}.sugg p{margin:0 0 6px}.sugg button{background:var(--y);color:#201800;font-weight:900;padding:8px 18px}.clutchNote{color:var(--y);font-weight:900;margin:10px 0 0}
.lead{text-align:center;font-weight:800;color:#ffc0c6;margin:12px 0 0}
.rh{margin:14px 0 6px;color:#ffc0c6;font-size:16px}
.wl{display:grid;gap:4px}.wl div{display:flex;gap:12px;align-items:baseline;background:var(--pn);padding:6px 12px;flex-wrap:wrap}
.wl b{font-size:19px}.wl em{font-style:normal;color:var(--y);font-weight:800}.wl small{color:var(--mu);width:100%}
.talk,.furi{background:var(--pn);border:1px solid var(--y);padding:12px 16px;margin-top:10px}
.talk b,.furi b{color:var(--y)}.talk p{margin:4px 0 0;line-height:1.7}
#furiBox{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}#furiBox button{border:1px solid #2c3a4b;background:#0b1320;padding:9px 4px;font-size:13px}#furiBox button:hover{border-color:var(--y)}#furiBox p{margin:0}
.goodList{margin-top:10px;background:var(--pn);padding:8px 12px}.goodList summary{cursor:pointer;color:var(--c2);font-weight:800;min-height:30px}
.rBtns{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:12px 0 24px}.rBtns>button:not(.go){border:1px solid var(--ln);background:var(--pn);margin-top:6px}

/* ゲーム中のボタン */
#gameUi{position:fixed;inset:0;pointer-events:none;display:none}
#gameUi button{pointer-events:auto}
.gbtn{position:absolute;background:rgba(5,10,18,.8);border:1px solid var(--ln);font-weight:800;font-size:13px;padding:6px 12px;min-height:44px}
.gbtn kbd{font:700 10px ui-monospace,monospace;color:var(--c2);display:block}
#btnPause{top:92px;right:14px;min-width:60px}
#btnScan{left:14px;bottom:18px;min-width:84px}
#btnOd{left:106px;bottom:18px;min-width:134px;overflow:hidden;color:var(--mu)}
#btnOd i{position:absolute;left:0;bottom:0;height:5px;background:var(--c);width:0;transition:width .2s}
#btnOd.ready{color:#02151b;background:var(--c);border-color:#fff;animation:odp .5s infinite alternate}
#btnOd.ready kbd{color:#02151b}
@keyframes odp{to{box-shadow:0 0 24px var(--c)}}
#picks{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;width:min(860px,96vw);display:none;grid-template-columns:repeat(4,1fr);gap:8px}
.pick{background:rgba(5,10,18,.92);border:2px solid var(--c);font-size:21px;font-weight:900;padding:10px 4px;min-height:64px;position:relative}
.pick b{position:absolute;left:6px;top:3px;font:700 11px ui-monospace,monospace;color:var(--c2)}
.pick:active{background:#0d3644}.pick.off{opacity:.25;border-color:var(--r)}
#tiles{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:min(860px,98vw);display:none;background:rgba(3,7,14,.72);padding:6px 6px 8px;touch-action:manipulation}
.tileHead{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;position:relative}
.slots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.slot{width:clamp(30px,5vw,44px);height:clamp(36px,6vh,46px);display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--c);background:rgba(13,54,68,.55);font-size:clamp(20px,3.2vw,28px);font-weight:900;color:#fff}
.tileBack{min-height:40px;padding:4px 12px;border:1px solid var(--y);background:#1a1606;color:var(--y);font-weight:900;font-size:14px;white-space:nowrap}
.tileRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tile{width:clamp(50px,8.4vw,74px);height:clamp(50px,8.5vh,64px);background:rgba(5,10,18,.95);border:2px solid var(--c);font-size:clamp(23px,3.4vw,30px);font-weight:900;padding:0;touch-action:manipulation}
.tile:active{background:#0d3644}.tile:disabled{opacity:.18;border-color:#2c3a4b}
#gameUi.tileMode #btnScan,#gameUi.tileMode #btnOd{bottom:var(--tileH,150px)}

/* 幅 */
#gameUi.pickMode #btnScan,#gameUi.pickMode #btnOd{bottom:96px}
@media (max-width:860px){
 .map{grid-template-columns:repeat(2,1fr)}.brief{grid-template-columns:1fr}.mapBottom{grid-template-columns:1fr}
 .stats{grid-template-columns:repeat(3,1fr)}.rBtns{grid-template-columns:1fr}.ttlHero{opacity:.3;right:-14vw}
 #screen.s-title{background:rgba(2,5,12,.55)}
 #furiBox{grid-template-columns:1fr}
}
@media (max-width:860px) and (orientation:portrait){
 #picks{grid-template-columns:1fr 1fr;bottom:12px}
 #gameUi.pickMode #btnScan,#gameUi.pickMode #btnOd{bottom:166px}
}
@media (orientation:landscape) and (max-height:520px){
 .story{display:none}.sub{margin-bottom:0}.ttlMain{width:min(460px,60vw)}
}

/* ---- 11/12 画面の 作り込み ---- */
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulseC{0%,100%{box-shadow:0 0 0 0 rgba(53,230,255,.0)}50%{box-shadow:0 0 18px 2px rgba(53,230,255,.45)}}
@keyframes starIn{0%{transform:scale(3) rotate(-40deg);opacity:0}60%{transform:scale(.85) rotate(6deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes sheen{0%,70%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(320%) skewX(-20deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
#screen.on>*{animation:scrIn .26s ease both}
#screen.s-title>*{animation:none}
.ttlMain>*{animation:scrIn .4s ease both}
.ttlMain>:nth-child(2){animation-delay:.06s}.ttlMain>:nth-child(3){animation-delay:.12s}.ttlMain>:nth-child(4){animation-delay:.18s}.ttlMain>:nth-child(5){animation-delay:.24s}.ttlMain>:nth-child(6){animation-delay:.3s}

/* タイトル */
.sub span{background:linear-gradient(180deg,#fff 30%,#ffc9cf);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(255,59,78,.75))}
.gradeTabs{box-shadow:0 6px 22px rgba(0,0,0,.45)}
.gradeTabs button{transition:background .12s,color .12s}
.gradeTabs button:hover{color:#fff}
.menu button{display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;box-shadow:inset 3px 0 0 var(--c)}
.menu button>span{min-width:0;flex:1}
.menu button::after{content:"";position:absolute;inset:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);transform:translateX(-120%) skewX(-20deg);pointer-events:none}
.menu button:hover::after{animation:sheen .7s ease}
.menu .main::after{animation:sheen 3.6s ease infinite}
.menu .main{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 8px 30px rgba(255,59,78,.35)}
.menu .wide{grid-column:1/3}
.ic{flex:none;width:34px;height:34px;display:grid;place-items:center;color:var(--c2)}
.ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.menu .main .ic{color:#fff;width:44px;height:44px}.menu .main .ic svg{width:40px;height:40px}
.arr{font-style:normal;font-size:22px;color:#fff;animation:blink 1.2s infinite}
.mbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08);flex:none!important}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--y))}
.rankBox{display:flex;flex-direction:column;gap:3px;min-width:150px}
.rankBar{display:block;height:4px;background:rgba(255,255,255,.14)}.rankBar i{display:block;height:100%;background:var(--y)}
.rankNext{color:var(--mu);font-size:11px}

/* 見出しと わく */
.hdr h2{font-style:italic;letter-spacing:.04em}
.hdr h2::before{content:"";display:inline-block;width:6px;height:.9em;background:var(--c);margin-right:10px;transform:skewX(-14deg);vertical-align:-.08em}
.back:hover,.lite:hover{border-color:var(--c);color:#fff}
.bL,.bR,.sheet,.rTop{position:relative;border-top:2px solid var(--c);box-shadow:0 14px 40px rgba(0,0,0,.5);background:linear-gradient(180deg,rgba(10,20,34,.92),rgba(5,9,16,.92))}
.bL::after,.bR::after,.sheet::after,.rTop::after{content:"";position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;border-right:2px solid var(--c);border-bottom:2px solid var(--c);pointer-events:none}

/* 地図 */
.route{max-width:1120px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center;position:relative}
.route::before{content:"";position:absolute;left:12px;right:12px;top:50%;height:2px;margin-top:-1px;background:#22344b}
.route i{position:relative;flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 11px ui-monospace,monospace;font-style:normal;color:#5d7186;border:1px solid #2c3a4b;background:#070d17}
.route i.done{background:var(--c);border-color:#fff;color:#02151b}
.route i.next{border-color:var(--y);color:var(--y);animation:pulseC 1.4s infinite}
.route i.fin{border-color:var(--r);color:var(--r)}.route i.fin.done{background:var(--y);color:#201800;border-color:#fff}
.node{min-height:136px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.node>span{position:relative}

ADD_TALK("g2-01","「家」は「いえ」と読むのに、画家では「か」、家来では「け」。同じ字なのに、なぜ読みがちがうのだろう。");
ADD_TALK("g2-02","「楽」は楽しいのほかに、音楽の「がく」、気楽の「らく」とも読む。三つの読みは、どこでつながっているのだろう。");
ADD_TALK("g2-03","「後」は後ろ、後で、午後、後半で読みがちがう。いくつの読み方があるかな。どうやって読み分けているのだろう。");
ADD_TALK("g2-04","「行」は行く、行う、行れつ、りょ行で読みがちがう。「いく」と「おこなう」は、どこがにているのだろう。");
ADD_TALK("g2-05","「時」の中には「寺」がいる。どちらも「じ」と読む。同じ形がかくれて同じ読みになる字を、ほかにもさがそう。");

ADD_TALK("g2-06","「新」は新しいでは「あたら」、新聞では「しん」と読む。同じ字なのに、なぜ読み方がいくつもあるのだろう。");
ADD_TALK("g2-07","校長の「長」は長いと同じ字だ。校長先生は長い人ではないのに、なぜ「長」の字を書くのだろう。");
ADD_TALK("g2-08","「読」「話」「語」にはどれも「言」が入っている。ほかにも「言」のある字を見つけられるかな。");
ADD_TALK("g2-09","「歩」は歩くでは「ある」、一歩では「ぽ」、歩道では「ほ」と読む。音がこんなにかわるのはなぜだろう。");
ADD_TALK("g2-10","「明」には日と月が、「鳴」には口と鳥が入っている。なぜこの形なのか考えてみよう。");

ADD_TALK("g3-01","「屋」は屋上では「おく」、本屋では「や」と読む。部屋は「へや」だ。同じ字なのに、なぜ読みがちがうのだろう。");
ADD_TALK("g3-02","「開」は開くで「ひらく」、開けるで「あける」、開店で「かい」と読む。送りがなで読みがかわるのはなぜだろう。");
ADD_TALK("g3-03","「橋」は一字だと「はし」、石橋だと「ばし」、鉄橋だと「きょう」。なぜ「ばし」とにごるのだろう。");
ADD_TALK("g3-04","「仕」と「使」は、どちらも左がわがにんべん。人とどんなつながりがある字なのだろう。ほかのにんべんの字もさがそう。");
ADD_TALK("g3-05","「持」と「拾」は、どちらも左がわがてへん。手を使う動きの字だ。ほかにてへんの字はいくつ見つかるかな。");
ADD_TALK("g3-06","「重」は重いで「おも」、体重で「じゅう」、重ねるで「かさ」と読む。一つの字になぜこんなに読みがあるのだろう。");

ADD_TALK("g3-09","「発」は発見で「はっ」、発明で「はつ」、出発で「ぱつ」。一つの字の音がこんなにかわるのはなぜだろう。");
ADD_TALK("g3-10","「表」は表すで「あらわ」、表紙で「ひょう」、表門で「おもて」。三つの読みをどう使い分けているのだろう。");
ADD_TALK("g3-11","「物」は動物で「ぶつ」、荷物で「もつ」、買い物で「もの」。三つの読みをどう使い分けているのだろう。");
ADD_TALK("g3-12","「葉」は言葉で「ば」、木の葉で「は」、子葉で「よう」。「落ち葉」はなぜ「ば」とにごるのだろう。");

ADD_TALK("g4-01","「栄」は栄養では「えい」、栄えるでは「さか」と読む。同じ字なのに読みが変わるのはなぜだろう。");
ADD_TALK("g4-02","「覚」は感覚で「かく」、覚えるで「おぼ」、目覚ましで「ざ」と読む。読みが三つに分かれるのはなぜだろう。");
ADD_TALK("g4-03","「競」は競走で「きょう」、競馬で「けい」と読む。どの語でどの読みか、言い分けられるかな。");
ADD_TALK("g4-04","「郡」と「群」は「君」を持ち、どちらも「ぐん」。「健」と「建」も同じ部分で「けん」。同じ部分で同じ音の字をさがそう。");
ADD_TALK("g4-05","「昨日」は「きのう」とも「さくじつ」とも読む。「一昨日」も二通りある。場面で読みを変えるのはなぜだろう。");
ADD_TALK("g4-06","「初」は初めてで「はじ」、初雪で「はつ」、初級で「しょ」と読む。一つの字で読みが三つもあるのはなぜだろう。");

ADD_TALK("g4-07","「省」は反省で「せい」、省エネで「しょう」、省くで「はぶ」と読む。一つの字に読み方がこんなにあるのはなぜだろう。");
ADD_TALK("g4-08","「続」は連続で「ぞく」、続くで「つづ」と読む。音読みと訓読みは全くちがう音なのに、なぜ同じ字で書くのだろう。");
ADD_TALK("g4-09","「低」と「底」は形がにていて、どちらも音読みが「てい」だ。同じ部分を持つと読みも同じになる字を、ほかにさがしてみよう。");
ADD_TALK("g4-10","「票」に木へんを付けると「標」になり、どちらも「ひょう」と読む。部分が同じで読みも同じ字は、ほかにあるだろうか。");
ADD_TALK("g4-11","「無」は無料で「む」、無事で「ぶ」と読む。どちらも「何もない」に通じる字なのに、なぜ読みが変わるのだろう。");
ADD_TALK("g4-12","「冷」は冷たい、冷える、冷めると、一つの字で訓読みがいくつもある。送りがなが読みを教えてくれるのはなぜだろう。");

ADD_TALK("g5-01","「易」は貿易では「えき」、易しいでは「やさ」、容易では「い」と読む。一つの字に、なぜ読みがいくつもあるのだろう。");
ADD_TALK("g5-02","「河」の音読みは「か」なのに、運河や銀河では「が」とにごる。どんなときににごるのだろう。");
ADD_TALK("g5-03","「逆」は逆転では「ぎゃく」、逆立ちでは「さか」と読む。音と訓で、言葉の感じはどう変わるだろう。");
ADD_TALK("g5-04","「興」は興味では「きょう」、復興では「こう」と読む。同じ字なのに、なぜ読みが変わるのだろう。");
ADD_TALK("g5-05","「雑」は雑音では「ざつ」、雑木林では「ぞう」と読む。どちらの語にも「いろいろ」という感じがあるのだろうか。");
ADD_TALK("g5-06","「飼」の左には「食」の形がある。「飼う」と食べることは、どうつながるのだろう。");

ADD_TALK("g5-07","「象」は動物なら「ぞう」、現象なら「しょう」と読む。同じ字なのに、なぜ読みが変わるのだろう。");

ADD_TALK("g5-10","「判」は判定では「はん」、評判では「ばん」と読む。にごる語とにごらない語は、どこがちがうのだろう。");

ADD_TALK("g5-12","「留」は留学では「りゅう」、留守では「る」と読む。同じ字なのに、なぜ読みが変わるのだろう。");

ADD_TALK("g6-01","「映」は映画では「えい」、映るでは「うつ」と読む。同じ字なのに、なぜ読みが変わるのだろう。");
ADD_TALK("g6-02","「供」は提供では「きょう」、お供では「とも」、子供では「ども」。一つの字の読みがこんなに変わるのはなぜだろう。");
ADD_TALK("g6-03","「源」は水源では「げん」、一字なら「みなもと」。なぜ、さんずいの字が物事の始まりも表すのだろう。");
ADD_TALK("g6-04","「降」は降水量では「こう」、降るでは「ふ」、降りるでは「お」と読む。同じ字なのに、なぜ読みが変わるのだろう。");
ADD_TALK("g6-05","「詞」の右は「司」、「誌」の右は「志」。どちらも「し」と読む。右側が音を教える字を、ほかにも探そう。");
ADD_TALK("g6-06","「傷」は傷口では「きず」、負傷では「しょう」と読む。訓と音で、言葉の感じはどうちがうだろう。");

  function codeToChar(ev) {
    var k = ev.key;
    if (k && k.length === 1 && /[a-zA-Z\-]/.test(k)) return k.toLowerCase();
    // 日本語入力が ON でも 打てるように 物理キーから 読む
    var m = /^Key([A-Z])$/.exec(ev.code || "");
    if (m) return m[1].toLowerCase();
    if (ev.code === "Minus") return "-";
    return null;
  }
  document.addEventListener("keydown", function (ev) {
    if (state !== "game" || !G || G.over) {
      if (state === "pause" && ev.key === "Escape") { ev.preventDefault(); ACTIONS.resume(); }
      return;
    }
    audio();
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.key === "Tab") { ev.preventDefault(); LL.hint(G); return; }
    if (G.input === "kana") {
      // 字を 書いている 間の キーは、入力の 枠に まかせる（変換の Space で OVERDRIVE が 出ないように）
      if (ev.key === "Escape" && !ev.isComposing) { ev.preventDefault(); pauseScreen(); }
      else if (ev.target !== kanaIn && ev.key === " ") { ev.preventDefault(); LL.overdrive(G); }
      return;
    }
    if (ev.key === " " || ev.code === "Space") { ev.preventDefault(); LL.overdrive(G); return; }
    if (ev.key === "Escape") { ev.preventDefault(); if (!LL.release(G)) pauseScreen(); return; }
    if (G.input === "tile") {
      if (ev.key === "Backspace") { ev.preventDefault(); LL.tileBack(G); }
      else if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); LL.tile(G, (+ev.key + 9) % 10); }
      return;
    }
    if (G.input === "pick") {
      if (/^[1-4]$/.test(ev.key)) { ev.preventDefault(); LL.pick(G, +ev.key - 1); }
      return;
    }
    var ch = codeToChar(ev);
    if (ch) { ev.preventDefault(); LL.key(G, ch); }
  });
  window.addEventListener("blur", function () { if (state === "game") pauseScreen(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden && state === "game") pauseScreen(); });
  window.addEventListener("beforeunload", persist);

  // ---------- 先生用の 点検 ----------
  window.lastLineSelfTest = function () {
    var out = [];
    try {
      var k = LL.SAVE_KEY + "_test"; localStorage.setItem(k, "1"); out.push("保存 " + (localStorage.getItem(k) === "1" ? "OK" : "NG")); localStorage.removeItem(k);
    } catch (e) { out.push("保存 NG（この端末では記録が残らない）"); }
    var t = LL.makeTyper("ぼうえき"), ok = true;
    "boueki".split("").forEach(function (ch) { ok = LL.typerFeed(t, ch) && ok; });
    out.push("ローマ字 " + (ok && t.done ? "OK" : "NG"));
    out.push("語 " + LL.words.length + " / 字 " + LL.GRADES.reduce(function (n, g) { return n + LL.kanji[g].length; }, 0));
    out.push("音 " + (A.ctx ? A.ctx.state : "まだ開始していない"));
    console.log(out.join("\n"));
    return out;
  };
  window.__LL = { get G() { return G; }, get state() { return state; }, ACTIONS: ACTIONS, get save() { return save; },
    // 点検用：n コマを 続けて 描き、1コマに かかった 時間（ミリ秒）を 返す
    bench: function (n) { var t0 = performance.now(), ts = last; for (var i = 0; i < n; i++) { ts += 16.7; tick(ts); } last = performance.now(); return (last - t0) / n; } };

  // 配られた リンク（#r=…）で 開いたら、その はんいに する
  (function () {
    try {
      var m = /[#&]r=([^&]+)/.exec(location.hash || "");
      if (!m) return;
      var p = LL.parseRange(decodeURIComponent(m[1]));
      if (!p) return;
      chooseGrade(p.g); setRange(p.g, p.r.k, LL_RANGE[p.r.pub] ? p.r.pub : "", p.r.n);
      gotRange = p.g;
      if (history.replaceState) history.replaceState(null, "", location.pathname + location.search);
    } catch (e) {}
  })();
  resize();
  titleScreen();
  requestAnimationFrame(frame);
})();

</script>
